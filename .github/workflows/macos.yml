name: macOS build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            aes128/go.sum
            backend/go.sum
            proto/vpnpb/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aes128/frontend/package-lock.json
      - name: Build frontend
        working-directory: aes128/frontend
        run: npm ci --ignore-scripts && npm run build
      - name: Build helper
        working-directory: backend
        run: go build ./... && go vet ./...
      - name: Build application
        working-directory: aes128
        run: go build -tags production -ldflags=-extldflags=-mmacosx-version-min=13.0 ./... && go vet ./...
      - name: Check protocol bindings
        working-directory: proto/vpnpb
        run: go build ./... && go vet ./...
      - name: Audit frontend dependencies
        working-directory: aes128/frontend
        run: npm audit --audit-level=high
