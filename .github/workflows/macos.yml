name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache-dependency-path: |
            aes128/go.sum
            backend/go.sum
            proto/vpnpb/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: aes128/frontend/package-lock.json
      - name: Build frontend
        working-directory: aes128/frontend
        run: npm ci --ignore-scripts && npm run build
      - name: Test helper
        working-directory: backend
        run: go test -race -ldflags=-extldflags=-mmacosx-version-min=13.0 ./... && go vet ./...
      - name: Test application
        working-directory: aes128
        run: go test -race -ldflags=-extldflags=-mmacosx-version-min=13.0 ./... && go vet ./...
      - name: Check protocol bindings
        working-directory: proto/vpnpb
        run: go test ./... && go vet ./...
      - name: Test installer lifecycle
        run: python3 packaging/macos/tests/test_scripts.py
      - name: Audit frontend dependencies
        working-directory: aes128/frontend
        run: npm audit --audit-level=high
